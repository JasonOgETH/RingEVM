[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "poseidon-solidity/=lib/poseidon-solidity/contracts/",
]
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Named RPC endpoints for fork tests, resolved from environment variables at
# runtime (a fork test self-skips when its alias is unset).
[rpc_endpoints]
robinhood = "${RINGS_ROBINHOOD_RPC_URL}"
elysium = "${RINGS_ELYSIUM_RPC_URL}"
arbitrum_one = "${RINGS_ARBITRUM_ONE_RPC_URL}"
